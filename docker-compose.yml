services:
  db:
    image: postgres:16-alpine
    container_name: odmori-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: odmori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: odmori
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odmori -d odmori"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: odmori-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://odmori:${POSTGRES_PASSWORD}@db:5432/odmori
      DATABASE_URL_UNPOOLED: postgresql://odmori:${POSTGRES_PASSWORD}@db:5432/odmori
      AUTH_SECRET: ${AUTH_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Godišnji odmori <onboarding@resend.dev>}
    ports:
      - "3000:3000"
